<?xml version="1.0" encoding="UTF-8"?>
<!--
  ╔══════════════════════════════════════════════════════════════════════╗
  ║  PLACEHOLDER — Arturita logo.                                         ║
  ║                                                                       ║
  ║  Swap this ONE file for the real Arturita asset (keep the same path   ║
  ║  and filename: web/public/arturita-logo.svg) and the Assistant tab    ║
  ║  picks it up with no code change — it is referenced exactly once, in  ║
  ║  web/app/dashboard/AssistantPanel.tsx (search: ARTURITA_LOGO_SRC).    ║
  ║                                                                       ║
  ║  A raster (PNG/SVG) at ~256×256+ works; a transparent background is   ║
  ║  recommended so the frosted orb behind it shows through. This         ║
  ║  placeholder uses `currentColor` so it inherits the accent in both    ║
  ║  light and dark themes — a real brand asset can hardcode its colors.  ║
  ╚══════════════════════════════════════════════════════════════════════╝
-->
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arturita">
  <!-- petal bloom (nods to 🌸 + the 7Ei honeycomb) -->
  <g fill="currentColor" opacity="0.9">
    <g transform="translate(64 64)">
      <g opacity="0.55">
        <ellipse cx="0" cy="-34" rx="13" ry="26" />
        <ellipse cx="0" cy="-34" rx="13" ry="26" transform="rotate(60)" />
        <ellipse cx="0" cy="-34" rx="13" ry="26" transform="rotate(120)" />
        <ellipse cx="0" cy="-34" rx="13" ry="26" transform="rotate(180)" />
        <ellipse cx="0" cy="-34" rx="13" ry="26" transform="rotate(240)" />
        <ellipse cx="0" cy="-34" rx="13" ry="26" transform="rotate(300)" />
      </g>
      <circle cx="0" cy="0" r="17" />
    </g>
  </g>
</svg>
