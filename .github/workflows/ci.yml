name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Install check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, web, app]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck
        # Typecheck is a real gate: TS errors fail the job. All three
        # workspaces (backend, web, app) currently typecheck clean.
        run: npx tsc --noEmit --skipLibCheck

  mobile:
    # `apps/mobile` is the SHIPPING iPhone remote and is deliberately NOT in the
    # `check` matrix above: that matrix installs with `npm install
    # --legacy-peer-deps`, which would defeat this app's exact react/react-dom
    # pins (see apps/mobile/package.json → expo.install.exclude), and it has no
    # test step. This app is its own npm root, so it installs in-place from its
    # own committed lockfile.
    #
    # This job is what enforces the web ⇄ mobile parity rule in CLAUDE.md: the
    # tripwire tests import the WEB modules directly and fail on drift. Before
    # this job existed, that tripwire fired into the void — a web nav change
    # (#286) landed red on `main` and nobody saw it.
    name: Mobile (apps/mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        # `npm ci` (clean, off the committed lockfile) — NOT `npm install`, and
        # NOT `--legacy-peer-deps`: the react/react-dom pins resolve cleanly on
        # their own, and papering over peers here is what would let a real
        # ERESOLVE regression through.
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # 22 tests, incl. the web-parity tripwires (src/navModel.test.ts,
        # src/attach.test.ts). They import `../../../web/**` by relative path;
        # those web modules are pure data with no imports of their own, so no
        # web install is needed here — only the repo checkout.
        run: npm test

      - name: Export (Metro/Hermes bundle)
        # Build gate: proves the app still bundles. Pure JS — Metro + Hermes,
        # no Xcode and no native toolchain, ~7s locally.
        run: npm run export

  web:
    # `web` is the PRIMARY UI (Next.js 15 on Vercel). Like the `mobile` job, it
    # is a standalone job rather than a matrix cell: it runs the real unit-test
    # + production-build gates, not just the install/typecheck that the `check`
    # matrix above covers. Before this job existed, NO workflow ran web's unit
    # tests — a broken web test (CONN-5) reached `main` unseen, the exact gap the
    # `mobile` job closed for the phone. web has its own committed lockfile
    # (web/package-lock.json), so it installs in-place like `mobile` does.
    name: Web (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # `npm ci` off the committed lockfile. `--legacy-peer-deps` matches the
        # `check` matrix and the backend test job: this repo's react 19 / next 15
        # peer graph needs it, and it resolves cleanly this way.
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # 243 tests (node --test --experimental-strip-types over app/** + lib/**).
        # No `|| true` — a failing test must fail the job.
        run: npm test

      - name: Build (Next.js production build)
        # Build gate: `next build` must pass, mirroring web/CLAUDE.md's
        # merge invariant.
        run: npm run build
