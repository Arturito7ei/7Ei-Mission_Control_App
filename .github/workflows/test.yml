name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests
        # Use the project's test script (node --test --import=tsx). tsx fully
        # transpiles TS and resolves extensionless imports; native
        # --experimental-strip-types cannot, so it must not be used here.
        # No `|| true` — a failing test must fail the job.
        run: npm test
        env:
          ANTHROPIC_API_KEY: test-key-not-real
          DATABASE_URL: 'file::memory:'
